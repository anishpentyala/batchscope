[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batchscope"
version = "0.1.0"
description = "Inspect exact finite sample coverage under explicitly declared loading plans"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
batchscope = "batchscope.__main__:main"

[tool.setuptools.packages.find]
include = ["batchscope*"]
