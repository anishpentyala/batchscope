name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standard-library:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - name: Test installed wheel outside checkout
        run: |
          python -m venv /tmp/batchscope-installed
          /tmp/batchscope-installed/bin/python -m pip install --no-deps dist/*.whl
          mkdir /tmp/batchscope-tests
          cp tests/test_core.py tests/test_cli.py /tmp/batchscope-tests/
          cd /tmp/batchscope-tests
          /tmp/batchscope-installed/bin/python -m unittest discover -v
          /tmp/batchscope-installed/bin/batchscope --help
      - name: Console launcher rejects failed report delivery
        run: |
          set +e
          /tmp/batchscope-installed/bin/batchscope examples/padded.json > /dev/full
          code=$?
          test "$code" -eq 2
  pytorch-cpu-parity:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import torch; assert torch.__version__ == '2.15.0+cpu', torch.__version__"
      - run: python -m unittest discover -s tests -p test_torch_parity.py -v
